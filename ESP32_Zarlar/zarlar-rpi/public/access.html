<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zarlar — Buitenlicht</title>
<!--
  access.html — portaalpagina voor ALLE buitenverlichting: de zones van ACCESS1, ACCESS2 en ACCESS3
  samen op één grondplan (sinds 12/11/2026; eerst één pagina per controller, server.js v2.13).
  Gegevens: elke 5 s GET /api/poll/access1..3 (= /json van elke controller: m<zone>, l<zone>, au, lux, nt, lb).
  Welke zone bij welke controller hoort, volgt uit de l<zone>-keys in /json (geen vaste tabel nodig);
  voor een controller die offline is, toont de pagina de laatst gekende (of geplande) zones grijs.
  Bediening: POST /api/set/accessN {z, v: 1|0, b} → /set_zone van de juiste controller.
  Dag/nacht: van ACCESS1 (luxsensor); anders van de eerste controller die online is.
  Oude links /access.html?id=N blijven werken: id kiest welke controller onderaan in het venster staat.
  Onderaan (zoals room/hvac/eco): Controller UI in een iframe, met knopjes 1/2/3 en een link naar een nieuw venster.
  Grondplan: zelfde tekening en plaatsen als de landingspagina van de ACCESS-sketch (landing.h).
  Deuren staan nog niet in /json (ACCESS v0.5): daarom hier nog niet.
-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0d12; --card:#111620; --card2:#161d28; --bdr:rgba(255,255,255,0.07);
  --text:#e8eef4; --muted:#6b7f8e; --dim:#1e2a36;
  --green:#00d18c; --amber:#ffb030; --red:#ff4555; --blue:#4da6ff;
  --font:'DM Sans', sans-serif; --mono:'DM Mono', monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; min-height:100%; }
.hdr { display:flex; align-items:center; gap:10px; padding:14px 16px 12px; border-bottom:1px solid var(--bdr); }
.back { width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--bdr);
  display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--muted); }
.hdr-title { flex:1; }
.hdr-title h1 { font-size:16px; font-weight:600; }
.hdr-title p { font-size:11px; color:var(--muted); margin-top:1px; font-family:var(--mono); }
.status-badge { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-family:var(--mono); }
.sdot { width:7px; height:7px; border-radius:50%; }
.content { padding:14px; max-width:560px; margin:auto; }
.rij { display:flex; gap:8px; margin-bottom:10px; }
.pil { flex:1; height:38px; border-radius:19px; cursor:default; border:1px solid var(--bdr); background:var(--card);
  display:flex; align-items:center; justify-content:center; gap:6px; font-size:14px; color:var(--muted); }
.pil.auto { border-color:rgba(0,209,140,.5); color:var(--green); }
.pil.man { border-color:rgba(255,176,48,.6); color:var(--amber); cursor:pointer; }
.pil.off { color:#3a4a58; }
.pil small { font-size:11px; font-family:var(--mono); }
.plan { background:var(--card); border:1px solid var(--bdr); border-radius:14px; padding:8px; margin-bottom:12px; }
.plan svg { width:100%; height:auto; display:block; }
.zl { fill:none; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
.tegels { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.tegel { background:var(--card); border:1px solid var(--bdr); border-radius:14px; padding:12px; user-select:none; -webkit-user-select:none; }
.tegel.aan { border-color:rgba(255,176,48,.6); background:#1d1a12; }
.groep { grid-column:1/-1; font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; margin:6px 2px -2px; }
.tegel.weg { opacity:.35; }
.tegel .kop { display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14px; cursor:pointer; }
.tegel .sub { font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:4px; min-height:15px; }
.mdot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
.mdot.mov { background:var(--red); box-shadow:0 0 6px var(--red); }
input[type=range] { width:100%; margin-top:10px; accent-color:var(--amber); }
.refresh { text-align:center; font-size:10px; color:var(--muted); font-family:var(--mono); margin-top:14px; }
/* PORTAL SECTIE (zoals room.html) */
.portal-section { background:var(--card); border:1px solid var(--bdr); border-radius:14px; margin-top:14px; overflow:hidden; }
.portal-header { padding:10px 14px; border-bottom:1px solid var(--bdr); font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; }
.portal-link { padding:10px 14px; border-bottom:1px solid var(--bdr); text-align:center; }
.portal-link a { color:var(--amber); text-decoration:none; font-size:13px; font-family:var(--mono); }
.portal-link a:hover { color:var(--text); }
.kies { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--bdr); }
.kies button { flex:1; height:32px; border-radius:16px; border:1px solid var(--bdr); background:var(--card2); color:var(--muted); font-family:var(--mono); font-size:12px; cursor:pointer; }
.kies button.sel { border-color:rgba(255,176,48,.6); color:var(--amber); }
#portal-iframe { width:100%; height:calc(100vh - 84px); border:none; display:block; background:#fff; }
</style>
</head>
<body>

<div class="hdr">
  <a href="/" class="back">←</a>
  <div class="hdr-title">
    <h1>Buitenlicht</h1>
    <p>ACCESS1 · ACCESS2 · ACCESS3</p>
  </div>
  <div class="status-badge">
    <div class="sdot" id="status-dot" style="background:#6b7f8e"></div>
    <span id="status-txt">laden...</span>
  </div>
</div>

<div class="content">
  <div class="rij" id="modi"></div>
  <div class="rij"><div class="pil" id="dagnacht">…</div></div>
  <div class="plan">
    <svg viewBox="0 0 340 330">
      <path d="M80 30 H300 V260 H320 V300 H80 V215 H45 V135 H80 Z" fill="#161d28" stroke="#3a4a58" stroke-width="1.5"/>
      <text x="190" y="19" text-anchor="middle" font-size="11" fill="#6b7f8e">straatzijde (N)</text>
      <text x="215" y="322" text-anchor="middle" font-size="11" fill="#6b7f8e">tuinzijde (S)</text>
      <text x="16" y="175" text-anchor="middle" font-size="11" fill="#6b7f8e" transform="rotate(-90 16 175)">veldzijde (W)</text>
      <text x="330" y="150" text-anchor="middle" font-size="11" fill="#6b7f8e" transform="rotate(90 330 150)">binnenplaats (E)</text>
      <text x="44" y="230" text-anchor="middle" font-size="10" fill="#6b7f8e">afdak</text>
      <g id="plz"></g>
    </svg>
  </div>
  <div class="tegels" id="tegels"></div>
  <div class="refresh">Vernieuwen elke 5 s · tik op lamp of tegel: aan/uit · schuifje: dimmen · ↺ = tik: terug naar auto · grijs = offline</div>

  <!-- PORTAL SECTIE -->
  <div class="portal-section">
    <div class="portal-header">▸ Controller UI</div>
    <div class="kies" id="kies"></div>
    <div class="portal-link">
      <a href="#" target="_blank" id="portal-link">▸ ACCESS controller ↗</a>
    </div>
    <iframe id="portal-iframe" src="" title="ACCESS Controller"></iframe>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const CTRL = { 1:{ip:'192.168.0.82', plek:'BURO'}, 2:{ip:'192.168.0.83', plek:'B&B'}, 3:{ip:'192.168.0.84', plek:'B&B'} };
// Zelfde plaatsen en omschrijvingen als landing.h van de ACCESS-sketch
const ZONES = {
  D:{n:'voordeur', p:'M80 120 L45 135 V215 L80 235', x:45, y:195},
  W4:{n:'veldkant', p:'M80 250 V290', x:80, y:270},
  S:{n:'terras', p:'M110 300 H310', x:200, y:300},
  W1:{n:'parking', p:'M80 40 V80', x:80, y:60},
  N1:{n:'puntgevel rechts', p:'M110 30 H160', x:135, y:30},
  N2:{n:'puntgevel links', p:'M215 30 H265', x:240, y:30},
  E:{n:'binnenplaats', p:'M300 60 V230', x:300, y:145}};
// Tegels per gevel
const GROEPEN = [['Straatzijde (N)', ['N1','N2']], ['Veldzijde (W)', ['W1','D','W4']], ['Tuinzijde (S)', ['S']], ['Binnenplaats (E)', ['E']]];
// Geplande verdeling (ACCESS_STANDAARD); wordt overschreven door wat /json werkelijk meldt
const eigenaar = { D:1, W4:1, S:1, W1:2, N1:2, N2:3, E:3 };
const data = { 1:null, 2:null, 3:null };
let bezig = 0, gebouwd = '';

function ns(t, a) { const e = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) e.setAttribute(k, a[k]); return e; }

// Zones van een controller = de l<zone>-keys in /json (behalve lux en lb)
function zonesUit(d) {
  return Object.keys(d).filter(k => /^l[a-z0-9]{1,3}$/.test(k) && k !== 'lux' && k !== 'lb')
    .map(k => k.slice(1).toUpperCase()).filter(c => ZONES[c]);
}
const zl = c => c.toLowerCase();
const actief = c => !!(eigenaar[c] && data[eigenaar[c]]);   // zone hoort bij een controller die online is

function bouw() {
  const g = $('plz'); g.innerHTML = '';
  for (const c in ZONES) {
    const z = ZONES[c];
    const gr = ns('g', { id: 'pg' + c });
    gr.onclick = () => wissel(c);
    gr.appendChild(ns('path', { d: z.p, 'class': 'zl', stroke: '#3a4a58', id: 'pl' + c }));
    gr.appendChild(ns('circle', { cx: z.x, cy: z.y, r: 14, fill: '#111620', stroke: '#6b7f8e', 'stroke-width': 1.5, id: 'pc' + c }));
    const t = ns('text', { x: z.x, y: z.y + 4, 'text-anchor': 'middle', 'font-size': 12, fill: '#e8eef4' }); t.textContent = c; gr.appendChild(t);
    gr.appendChild(ns('circle', { cx: z.x + 12, cy: z.y - 12, r: 4.5, fill: '#ff4555', id: 'pm' + c, visibility: 'hidden' }));
    g.appendChild(gr);
  }
  let h = '';
  for (const [kop, codes] of GROEPEN) {
    h += `<div class="groep">${kop}</div>`;
    for (const c of codes) h +=
      `<div class="tegel" id="t${c}"><div class="kop" onclick="wissel('${c}')"><span>${c} · ${ZONES[c].n}</span><span class="mdot" id="d${c}"></span></div>
       <div class="sub" id="s${c}">…</div>
       <input type="range" min="0" max="100" step="1" id="r${c}" onchange="dim('${c}', this.value)"></div>`;
  }
  $('tegels').innerHTML = h;
  $('modi').innerHTML = [1,2,3].map(n => `<div class="pil" id="mo${n}" onclick="naarAuto(${n})">A${n}</div>`).join('');
}

function toon() {
  let online = 0;
  for (const n of [1,2,3]) {
    const d = data[n], m = $('mo' + n);
    if (!d) { m.className = 'pil off'; m.innerHTML = `A${n} <small>offline</small>`; continue; }
    online++;
    m.className = 'pil ' + (d.au ? 'auto' : 'man');
    m.innerHTML = `A${n} <small>${d.au ? 'auto' : 'manueel ↺'}</small>`;
  }
  $('status-dot').style.background = online === 3 ? '#00d18c' : online ? '#ffb030' : '#ff4555';
  $('status-txt').textContent = `${online}/3 online`;

  // Dag/nacht: ACCESS1 (luxsensor), anders de eerste controller die online is
  const bron = [1,2,3].find(n => data[n]);
  const dn = bron && data[bron];
  $('dagnacht').textContent = !dn ? '—' :
    (dn.nt ? '☾ Nacht' : '☀ Dag') + (dn.lux >= 0 ? ` · ${dn.lux} lux` : (dn.lb < 0 ? ' · vast' : '')) + (bron !== 1 ? ` · bron A${bron}` : '');

  for (const c in ZONES) {
    const n = eigenaar[c], d = n && data[n], ok = actief(c);
    const l = ok ? (parseInt(d['l' + zl(c)]) || 0) : 0, mv = ok ? (parseInt(d['m' + zl(c)]) || 0) : 0, aan = l > 0;
    const a = 0.35 + 0.65 * l / 100;
    const g = $('pg' + c);
    g.setAttribute('opacity', ok ? 1 : 0.3); g.style.cursor = ok ? 'pointer' : 'default';
    $('pl' + c).setAttribute('stroke', aan ? `rgba(255,176,48,${a})` : '#3a4a58');
    $('pc' + c).setAttribute('fill', aan ? `rgba(255,176,48,${a * 0.6})` : '#111620');
    $('pc' + c).setAttribute('stroke', aan ? '#ffb030' : '#6b7f8e');
    $('pm' + c).setAttribute('visibility', mv > 0 ? 'visible' : 'hidden');
    $('t' + c).className = 'tegel' + (aan ? ' aan' : '') + (ok ? '' : ' weg');
    $('d' + c).className = 'mdot' + (mv > 0 ? ' mov' : '');
    $('s' + c).textContent = !n ? 'geen controller' : !ok ? `A${n} · offline` : `A${n} · ${aan ? l + ' %' : 'uit'} · ${mv}/min`;
    const r = $('r' + c); r.disabled = !ok;
    if (document.activeElement !== r) r.value = l;
  }
}

async function haal(n) {
  try {
    const r = await fetch(`/api/poll/access${n}?t=` + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (d.online === false) throw 0;
    data[n] = d;
    for (const c of zonesUit(d)) eigenaar[c] = n;   // werkelijke verdeling volgens /json
  } catch { data[n] = null; }
}

async function poll() {
  if (bezig) return;
  await Promise.all([1,2,3].map(haal));
  if (!bezig) toon();
}

async function stuur(n, body) {
  bezig = 1;
  try { await fetch(`/api/set/access${n}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch {}
  bezig = 0; poll();
}
function wissel(c) {
  if (!actief(c)) return;
  const n = eigenaar[c];
  stuur(n, { z: c, v: (parseInt(data[n]['l' + zl(c)]) || 0) > 0 ? 0 : 1 });
}
function dim(c, v) {
  if (!actief(c)) return;
  v = parseInt(v); stuur(eigenaar[c], v > 0 ? { z: c, v: 1, b: v } : { z: c, v: 0 });
}
// Terug naar AUTO: /set_zone v=0 zet die controller terug op AUTO (zone uit). Kies een brandende zone.
function naarAuto(n) {
  const d = data[n]; if (!d || d.au) return;
  const eigen = zonesUit(d); if (!eigen.length) return;
  const c = eigen.find(c => (parseInt(d['l' + zl(c)]) || 0) > 0) || eigen[0];
  stuur(n, { z: c, v: 0 });
}

// Controller UI: knopjes 1/2/3; ?id=N (oude links) kiest de controller
function kies(n) {
  [1,2,3].forEach(i => $('k' + i).className = i === n ? 'sel' : '');
  $('portal-link').href = `http://${CTRL[n].ip}/`;
  $('portal-link').textContent = `▸ ACCESS${n} controller ↗  (${CTRL[n].ip} · ${CTRL[n].plek})`;
  $('portal-iframe').src = `http://${CTRL[n].ip}/`;
}
$('kies').innerHTML = [1,2,3].map(n => `<button id="k${n}" onclick="kies(${n})">ACCESS${n}</button>`).join('');

bouw();
kies(Math.max(1, Math.min(3, parseInt(new URLSearchParams(location.search).get('id')) || 1)));
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
